name: Publish verified release
description: Reconcile an existing GitHub draft without replacing any existing bytes, then publish.
inputs:
  directory:
    description: Directory produced by the package action and attested by the caller workflow.
    default: dist
  tag:
    description: Exact tag used as the workflow dispatch ref.
    required: true
  token:
    description: Calling repository's built-in GITHUB_TOKEN.
    required: true
  verified-tag-recovery:
    description: Recover an already attested exact tag from the approved main recovery workflow.
    default: 'false'
  signer-workflow:
    description: Approved workflow that attested the release artifacts.
    default: .github/workflows/release.yml
  kind:
    description: Release kind (plugin or source).
    default: plugin
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: ${{ github.action_path }}/../../.python-version
    - shell: bash
      env:
        TOOL_ROOT: ${{ github.action_path }}/../..
        RELEASE_DIRECTORY: ${{ inputs.directory }}
        RELEASE_TAG: ${{ inputs.tag }}
        GH_TOKEN: ${{ inputs.token }}
        VERIFIED_TAG_RECOVERY: ${{ inputs.verified-tag-recovery }}
        SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
        RELEASE_KIND: ${{ inputs.kind }}
      run: |
        recovery=()
        case "$VERIFIED_TAG_RECOVERY" in
          true) recovery=(--verified-tag-recovery) ;;
          false) ;;
          *) echo "Invalid verified-tag-recovery input" >&2; exit 1 ;;
        esac
        case "$RELEASE_KIND" in
          plugin|source) ;;
          *) echo "Invalid kind input" >&2; exit 1 ;;
        esac
        python "$TOOL_ROOT/tools.py" publish --directory "$RELEASE_DIRECTORY" --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER_WORKFLOW" --kind "$RELEASE_KIND" "${recovery[@]}"
