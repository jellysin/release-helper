name: Check repository policy
description: Validate repository documents, immutable Action pins, release-please configuration, and optionally a Jellyfin plugin repository. Caller must check out with fetch-depth 0 when last-release-sha is set.
inputs:
  directory:
    description: Repository directory.
    default: .
  catalog:
    description: Validate manifest.json and plugins.json in the repository, true or false; any other value fails.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: ${{ github.action_path }}/../../.python-version
    - shell: bash
      env:
        TOOL_ROOT: ${{ github.action_path }}/../..
        REPOSITORY_DIRECTORY: ${{ inputs.directory }}
        CHECK_CATALOG: ${{ inputs.catalog }}
      run: |
        case "$CHECK_CATALOG" in
          true | false) ;;
          *) echo "Invalid catalog input" >&2; exit 1 ;;
        esac
        python "$TOOL_ROOT/tools.py" check-policy --directory "$REPOSITORY_DIRECTORY"
        if [[ "$CHECK_CATALOG" == 'true' ]]; then
          python "$TOOL_ROOT/tools.py" validate-catalog --manifest "$REPOSITORY_DIRECTORY/manifest.json" --allowlist "$REPOSITORY_DIRECTORY/plugins.json"
        fi
