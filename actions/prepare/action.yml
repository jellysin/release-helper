name: Prepare release
description: Create the exact tag on an approved main commit and one unpublished draft; never publish.
inputs:
  tag:
    description: Release tag, v followed by the version the approved commit records.
    required: true
  commit:
    description: Full SHA of the approved commit on main; the checkout needs full history.
    required: true
  token:
    description: Calling repository's built-in GITHUB_TOKEN with contents write.
    required: true
  version-path:
    description: Repository path of the version file.
    default: version.txt
  changelog-path:
    description: Repository path of the release-please changelog; its section becomes the draft text.
    default: ''
  skip-tagged:
    description: "'true' writes nothing when the tag already names the commit, for a repository whose release another writer creates."
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: ${{ github.action_path }}/../../.python-version
    - shell: bash
      env:
        TOOL_ROOT: ${{ github.action_path }}/../..
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION_PATH: ${{ inputs.version-path }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        SKIP_TAGGED: ${{ inputs.skip-tagged }}
      run: |
        args=(--repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --version-path "$VERSION_PATH")
        if [[ -n "$CHANGELOG_PATH" ]]; then args+=(--changelog-path "$CHANGELOG_PATH"); fi
        case "$SKIP_TAGGED" in
          true) args+=(--skip-tagged) ;;
          false) ;;
          *) echo "skip-tagged must be 'true' or 'false'" >&2; exit 1 ;;
        esac
        python "$TOOL_ROOT/tools.py" prepare "${args[@]}"
