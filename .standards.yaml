---
version: 1
repository:
  owner: jellysin
  name: release-helper
  visibility: public
  description: "Build and release helper for JellySin plugins"
  homepage: ""
  topics: []
profiles:
  - app-service
# Agent clients and editors in use. Praetor generates and verifies files of these only.
agent_clients:
  - claude
  - codex
  - gemini
editors:
  - universal
  - vscode
  - antigravity
facets:
  - security:high
  - agent:sandboxed
# One maintainer: review mode renders zero required approvals. The count stays, so that
# restoring independent review keeps the minimum.
overrides:
  branch_protection:
    required_approving_reviewers: 1
    review_mode: single_maintainer
    # Declared at its live value; the forge default is the stricter one.
    require_extra_approval_for_unattributed_changes: true
register:
  sources:
    expected: 13
    sha256:
      sha256:530d5c2a5a78d0b3861b257d587ef50a2c7092518078aa16430b1f2f19c4619c
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: release-token
    path: .github/workflows/release-please.yml
    category: C
    reason: "category C: RELEASE_APP_PRIVATE_KEY is an optional workflow_call secret; without it release-please falls back to github.token and the run log names that path; the rule gains an optional-key shape in cordanaLLM/praetor#1833 (DECISION release-helper-optional-key-vs-release-token-rule)"
    expires: 2026-11-16
release:
  e2e:
    paths: [tests/e2e/**]
    # #122 and #123 shipped before tests/e2e existed; their behaviour is now covered by
    # tests/e2e/test_makefile_spaced_venv.py and tests/e2e/test_source_dot_repository.py.
    # #126 shipped without an e2e test; its behaviour is now covered by
    # tests/e2e/test_prepare_release_merge.py and tests/e2e/test_publish_bundle_retry.py.
    # #155 shipped without an e2e test; its behaviour is now covered by
    # tests/e2e/test_release_file_reader.py.
    since: 2625f4b711c3580a6e7d59cb854dbb11c16ec34a
  # The app-service profile requires five release test levels. Each binding names the
  # tests that exercise the level and the CI step that runs them: the checks job in
  # .github/workflows/ci.yml. The job is named because build-signed.yml runs make, and
  # the engine then reads the Makefile's test command into that called-only workflow.
  test_levels:
    unit:
      paths: [tests/test_*.py]
      job: checks
      run: unittest discover -s tests
    e2e:
      paths: [tests/e2e/**]
      job: checks
      run: unittest discover -s tests
    # The CI job starts real Jellyfin 12 servers, checks that they offer the floor fixture
    # and that they refuse the wrong-abi fixture (README.md, server check).
    integration:
      paths: [actions/server-check/action.yml]
      job: checks
      run: tools.py server-check
    # Verified tag recovery and failed-upload recovery (README.md, plugin repository trust
    # and recovery).
    recovery_restore:
      paths: [tests/test_release_recovery.py]
      job: checks
      run: unittest discover -s tests
    # Repeated catalog publish cycles and volume at the manifest limits.
    load_soak:
      paths: [tests/load/**]
      job: checks
      run: unittest discover -s tests
