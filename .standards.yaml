---
version: 1
repository:
  owner: jellysin
  name: release-helper
  visibility: public
  description: "Build and release helper for JellySin plugins"
  homepage: ""
  topics: []
profiles:
  - app-service
# Agent clients and editors in use. Praetor generates and verifies files of these only.
agent_clients:
  - claude
  - codex
  - gemini
editors:
  - universal
  - vscode
  - antigravity
facets:
  - security:high
  - agent:sandboxed
# One maintainer: review mode renders zero required approvals. The count stays, so that
# restoring independent review keeps the minimum.
overrides:
  branch_protection:
    required_approving_reviewers: 1
    review_mode: single_maintainer
    # Declared at its live value; the forge default is the stricter one.
    require_extra_approval_for_unattributed_changes: true
register:
  sources:
    expected: 13
    sha256:
      sha256:530d5c2a5a78d0b3861b257d587ef50a2c7092518078aa16430b1f2f19c4619c
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: HISS-11
    path: .github/workflows/prepare-release.yml
    reason: adoption found the release workflows short of the declared supply chain (SLSA Build Level 3 declared, Level 0 measured; enforce_cosign without a cosign signing step; require_sbom without an SBOM step); raise them as docs/guides/releasing.md in Praetor describes, then remove this entry
    expires: "2027-01-09"
  - rule: declared-linters
    tool: trivy
    reason: the repository ships no container image and its only third-party packages are the hash-pinned development tools in requirements-dev.txt; trivy releases v0.69.4 to v0.69.6 and the trivy-action tags were replaced by malicious builds in March 2026 (CVE-2026-33634), so a trivy job waits until a release is verified against its signed provenance; add the job then and remove this entry
    expires: "2027-01-11"
