name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install pinned development tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check source and repository policy
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python tools.py check-policy
      - name: Run the shared check action from this checkout
        uses: ./actions/check
      # The shared actions run end to end on committed fixtures (tests/data), as a plugin repository runs them.
      - name: Package the fixture plugin with the shared package action
        id: fixture-package
        uses: ./actions/package
        with:
          publish-directory: tests/data/plugin/publish
          metadata-path: tests/data/plugin/plugin.json
          version-path: tests/data/plugin/version.txt
          output-directory: ${{ runner.temp }}/fixture-dist
      - name: The package action wrote the archive and its release files
        env:
          ARCHIVE: ${{ steps.fixture-package.outputs.archive }}
          DIRECTORY: ${{ steps.fixture-package.outputs.directory }}
        run: |
          test -s "$ARCHIVE"
          for file in release.json checksums.txt sbom.spdx.json; do test -s "$DIRECTORY/$file"; done
      - name: Validate the fixture plugin repository through the check action's catalog branch
        uses: ./actions/check
        with:
          directory: tests/data/repository
          catalog: 'true'
      # Ahead of the tests: tests/test_workflow_lint_exceptions.py runs this binary from PATH.
      - name: Validate workflows with checksum-pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Test packaging, publication, network isolation and multi-plugin catalogs
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report
      - name: Write the server check fixtures
        run: |
          python tools.py server-check --emit-fixture floor "$RUNNER_TEMP/floor.json"
          python tools.py server-check --emit-fixture wrong-abi "$RUNNER_TEMP/wrong-abi.json"
      - name: A real Jellyfin server offers the floor fixture
        uses: ./actions/server-check
        with:
          manifest: ${{ runner.temp }}/floor.json
      # README.md:25 claims every Jellyfin 12 server; the floor fixture also runs on the older minors.
      - name: A real Jellyfin 12.0 server offers the floor fixture
        uses: ./actions/server-check
        with:
          manifest: ${{ runner.temp }}/floor.json
          image: jellyfin/jellyfin:12.0@sha256:baba630419915985442f315f08b0cf46d9f4c8a0cc4bd38e94a6d35751dd5ef5
      - name: A real Jellyfin 12.1 server offers the floor fixture
        uses: ./actions/server-check
        with:
          manifest: ${{ runner.temp }}/floor.json
          image: jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
      # The step passes only on the refusal it expects; any other failure fails it.
      - name: The same server refuses the wrong-abi fixture
        run: |
          status=0
          output="$(python tools.py server-check --manifest "$RUNNER_TEMP/wrong-abi.json" 2>&1)" || status=$?
          printf '%s\n' "$output"
          [[ "$status" -eq 1 ]]
          grep --fixed-strings --quiet 'does not offer d0973630-1561-4f3a-b26e-664229e6043e 1.0.0.0 (targetAbi 12.65534.0.0)' <<<"$output"
  # The whole history, not only the tree: a credential removed in a later commit still leaks.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history with checksum-pinned gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --proto '=https' --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --no-banner --exit-code 1 .
  # The rules are local (.config/semgrep/rules.yml) and the container has no network, so no
  # registry rule or update decides a verdict; any finding fails the job.
  semgrep:
    name: static analysis (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image stays literal in the command: praetorctl audit reads it there to see semgrep run.
      - name: Scan with the digest-pinned semgrep image
        run: docker run --rm --network none --volume "$GITHUB_WORKSPACE:/src" --workdir /src semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 semgrep scan --config .config/semgrep/rules.yml --error --metrics off --disable-version-check .
  governance:
    name: governance (praetor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      # PRAETOR_REF is the repository's engine pin: the git hooks and make read it from here
      # (.config/lefthook/engine.sh) and run the same engine CI installs. One value only.
      - name: Install praetorctl
        env:
          PRAETOR_REF: 3bbde07342bdece12c46f74b0ee2c1f51129478f
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          ln -s "$(go env GOPATH)/bin/standardsctl" "$(go env GOPATH)/bin/praetorctl"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Context integrity
        run: praetorctl compile-context --verify
      - name: HISS audit
        run: praetorctl audit
      # No flavor describes a plain Python tool yet (cordanaLLM/praetor#935). The command
      # prints that reason and exits 0; it starts auditing once a flavor matches.
      - name: Flavor audit
        run: |
          praetorctl state init --if-absent .
          praetorctl flavor audit .
