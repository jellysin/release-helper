[project]
name = "jellysin-release-helper"
version = "1.6.1" # x-release-please-version
description = "Build-time release and plugin repository tooling for JellySin plugins"
requires-python = ">=3.14"
license = "EUPL-1.2"
dependencies = []

[tool.ruff]
# Python 3.13 syntax, though 3.14 is the floor: semgrep 1.180 cannot parse the 3.14 unparenthesized
# except clause, and a line it cannot parse is a line it does not scan.
target-version = "py313"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C90", "PLR0915"]

# Praetor writes these three files, and a local repair disables its checkpoint lifecycle
# (cordanaLLM/praetor#1204). Each entry ends 2027-01-09: tests/test_lint_exceptions.py fails
# after that date, and as soon as a file passes without its entry. The import-order (I001)
# entries are gone: the refreshed files pass it.
[tool.ruff.format]
exclude = [
  ".config/agent/hooks/block_evasion.py", # cordanaLLM/praetor#1204, until 2027-01-09
  ".config/lefthook/scripts/checkpoint.py", # cordanaLLM/praetor#1204, until 2027-01-09
  ".config/lefthook/scripts/common.py", # cordanaLLM/praetor#1204, until 2027-01-09
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60

[tool.coverage.run]
source = ["jellysin_tooling"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
